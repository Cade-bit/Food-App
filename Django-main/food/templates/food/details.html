{% extends 'food/base.html' %}
{% block title %}{{item.item_name}} details{% endblock %}

    {% block body %}
    <div class="container position-absolute top-50 start-50 translate-middle">
        <div class="row">
            <div class="col-md-6">
                <img src="{{item.item_image}}" alt="{{item.item_name}}" class="card details-img"/>
            </div>
            <div class="col-md-6">
                <h1>{{ object.item_name }}</h1>
                <h2>Item Description: {{ object.item_description }}</h2>
                <h3>Item Price: £{{ object.item_price }}</h3>
                <a href="{% url 'food:delete_item' item.id %}" class="btn btn-danger" role="button">Delete Item</a>
            </div>
        </div>
    </div>
    {% endblock %}
