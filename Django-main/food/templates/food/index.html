{% extends 'food/base.html' %}
{% block title %}Home - FoodApp{% endblock %}

   {% block body %}
{% for item in item_list %}
  <div class="row">
    <div class="col-md-3 offset-md-2">
      <img src="{{ item.item_image }}" alt="{{ item.item_name }}" class="card custom-img"/>
    </div>
    <div class="col-md-4">
      <h3>{{ item.item_name }}</h3>
      <h5>{{ item.item_description }}</h5>
      <h5>£{{ item.item_price }}</h5>
      <h6>Added by: {{ item.user_name }}</h6>
    </div>
    <div class="col-md-2">
      <a href="{% url 'food:detail' item.id %}" class="btn btn-success" role="button">See Details</a>
    </div>
  </div>

          <a href="{% url 'food:detail' item.id %}"> {{ item.id }} -- {{item.item_name}}</a>
        </li>
    </ul>
    
</div> ----->
{% endfor %}
  {% endblock %}
