$kind: http-request
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response time is less than 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      pm.test("Response has valid JSON body", function () {
          pm.response.to.be.json;
      });

      pm.test("Response contains expected fields", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("item_name");
          pm.expect(jsonData).to.have.property("item_price");
      });
order: 2000
method: POST
url: "{{base_url}}/food/api/items/"
description: Create a new food item. Requires authentication.
